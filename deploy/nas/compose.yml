# docker compose for the RazorReaper backend on the UGREEN NAS. See README.md.
# Project dir on the NAS: /volume1/docker/razorreaper/src/RR-Admin-Panel/deploy/nas, inside a git
# clone of this repo (since 2026-09-12; it was an SMB mirror before). Deploy = `git pull` there +
# `docker compose up -d --build <service>`, wrapped by tools/deploy-nas.ps1. Secrets/credentials
# never live in this tree: they sit under ${DATA_DIR}/env and ${DATA_DIR}/cloudflared, and
# deploy/nas/.env is git-ignored, so a pull can never clobber or publish them.
name: razorreaper
services:
  # Locally-managed tunnel: ingress rules in ./cloudflared/config.yml (tracked, no secrets),
  # credentials JSON (created by `cloudflared tunnel create rr-nas`) in ${DATA_DIR}/cloudflared.
  cloudflared:
    image: cloudflare/cloudflared:latest
    # SMB-synced configs are owned by the NAS source-share group (GID 10).
    group_add:
      - "10"
    restart: unless-stopped
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      - ${DATA_DIR}/cloudflared:/etc/cloudflared/creds:ro
    # no depends_on: services come up in stages (media -> bot -> api); cloudflared answers 502
    # for a hostname until its container exists and keeps retrying.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${MEDIA_DIR}:/srv/media:ro
    # no ports: reachable only through the tunnel (and the docker network)

  bot:
    build:
      context: ${BOT_SRC}
    restart: unless-stopped
    env_file: ${DATA_DIR}/env/bot.env   # TOKEN, NOTIFIER_*, VERIFY_* (see .env.example)
    environment:
      - PORT=8080
    volumes:
      - ${DATA_DIR}/bot:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # rr-api (W3.5): Node 22 service running the Pages Functions + worker code on SQLite.
  # Tunnel hostname api.<domain> -> http://rr-api:8787 (no host port; reachable only via the tunnel).
  rr-api:
    image: razorreaper-rr-api:release-hardening-20260831
    pull_policy: build
    build:
      context: ../..
      dockerfile: deploy/nas/rr-api/Dockerfile
      args:
        BUILD_SHA: ${BUILD_SHA:-unknown}   # set by tools/deploy-nas.ps1 (NAS checkout HEAD)
    restart: unless-stopped
    env_file: ${DATA_DIR}/env/rr-api.env   # copy of rr-api/.env.example, filled in
    # System health sources: backup age from the read-only backup mount, containers through the
    # read-only socket proxy below (the bot is reached at its default http://bot:8080).
    environment:
      - BACKUP_DIR=/backups
      - DOCKER_PROXY_URL=http://docker-proxy:2375
    volumes:
      - ${DATA_DIR}/db:/data/db
      - ${BACKUP_DIR}:/backups:ro
    networks:
      - default
      - docker-proxy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Admin SPA + same-origin API gateway. Cloudflare Access protects
  # admin.<domain>; Caddy forwards its JWT and browser Origin/Host to rr-api.
  admin:
    image: razorreaper-admin:release-hardening-20260831
    pull_policy: build
    build:
      context: ../..
      dockerfile: deploy/nas/admin/Dockerfile
    restart: unless-stopped
    env_file: ${DATA_DIR}/env/admin.env   # ORIGIN_KEY only; see admin.env.example
    depends_on:
      rr-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  backup:
    image: alpine:3.20
    restart: unless-stopped
    volumes:
      - ${DATA_DIR}/db:/data/db:ro
      - ${BACKUP_DIR}:/backups
      - ./backup/backup.sh:/backup.sh:ro
    command: sh -c "apk add --no-cache sqlite >/dev/null && echo '15 3 * * * sh /backup.sh' > /etc/crontabs/root && crond -f -l 2"

  # Read-only Docker API for the System health page (handoff 2026-09-12 §2.11). rr-api reads the
  # container list, inspect and one-shot stats through it. The socket's :ro does not stop API
  # writes on its own; POST=0 and every other section set to 0 do, so a compromised rr-api still
  # cannot start, stop, exec or pull anything. No ports; its only network is internal and shared
  # with rr-api alone.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    restart: unless-stopped
    environment:
      - CONTAINERS=1
      - POST=0
      - ALLOW_START=0
      - ALLOW_STOP=0
      - ALLOW_RESTARTS=0
      - AUTH=0
      - BUILD=0
      - COMMIT=0
      - CONFIGS=0
      - DISTRIBUTION=0
      - EVENTS=0
      - EXEC=0
      - GRPC=0
      - IMAGES=0
      - INFO=0
      - NETWORKS=0
      - NODES=0
      - PING=0
      - PLUGINS=0
      - SECRETS=0
      - SERVICES=0
      - SESSION=0
      - SWARM=0
      - SYSTEM=0
      - TASKS=0
      - VERSION=0
      - VOLUMES=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-proxy

networks:
  # internal: no route off the host, and only rr-api joins it next to the proxy.
  docker-proxy:
    internal: true
