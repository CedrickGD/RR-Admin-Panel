name = "rr-admin-panel"
compatibility_date = "2026-02-25"
pages_build_output_dir = "dist"

[vars]
STORAGE_BACKEND = "d1"
AUTH_MODE = "access"
ACCESS_ENFORCEMENT = "strict"
ACCESS_ALLOWED_EMAIL = ""
ACCESS_ADMIN_EMAIL = ""
# Cloudflare Access JWT verification (AUTH_MODE=access): team domain without scheme, and the
# comma-separated AUD tags of every Access application that fronts this project (prod + preview).
ACCESS_TEAM_DOMAIN = "rr-adminpanel.cloudflareaccess.com"
ACCESS_AUD = "<prod-aud>,<preview-aud>"
# rr.install.v1 rollout switches (docs/superpowers/specs/2026-08-21-install-signing-contract.md):
# keep accepting the shared ingest key next to install signatures ("true" until every client is
# >= 1.4.9), and whether feedback / access-status / license routes must be signed ("false" while
# legacy clients are still around).
LEGACY_INGEST_KEY_ENABLED = "true"
REQUIRE_INSTALL_SIGNATURE = "false"
# Proxy mode (docs/superpowers/specs/2026-08-21-proxy-shells.md): with ORIGIN_BASE set AND the
# ORIGIN_KEY secret present (`npx wrangler pages secret put ORIGIN_KEY`, same value as rr-api),
# functions/api/_middleware.ts + functions/v1/_middleware.ts forward every /api/* (except
# /api/health) and /v1/* request to rr-api on the NAS. Leave unset to keep serving from D1.
# ORIGIN_BASE = "https://origin.razorreaper.app"

[[d1_databases]]
binding = "DB"
database_name = "rr_admin_panel"
database_id = "replace-with-d1-database-id"

[[kv_namespaces]]
binding = "KV"
id = "replace-with-kv-namespace-id"
preview_id = "replace-with-kv-preview-id"
