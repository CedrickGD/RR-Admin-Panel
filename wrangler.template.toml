name = "rr-admin-panel"
compatibility_date = "2026-02-25"
pages_build_output_dir = "dist"

[vars]
STORAGE_BACKEND = "d1"
AUTH_MODE = "access"
ACCESS_ENFORCEMENT = "strict"
ACCESS_ALLOWED_EMAIL = ""
ACCESS_ADMIN_EMAIL = ""
# Cloudflare Access JWT verification (AUTH_MODE=access): team domain without scheme, and the
# comma-separated AUD tags of every Access application that fronts this project (prod + preview).
ACCESS_TEAM_DOMAIN = "rr-adminpanel.cloudflareaccess.com"
ACCESS_AUD = "<prod-aud>,<preview-aud>"

[[d1_databases]]
binding = "DB"
database_name = "rr_admin_panel"
database_id = "replace-with-d1-database-id"

[[kv_namespaces]]
binding = "KV"
id = "replace-with-kv-namespace-id"
preview_id = "replace-with-kv-preview-id"
