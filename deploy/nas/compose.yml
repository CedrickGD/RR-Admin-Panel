# docker compose for the RazorReaper backend on the UGREEN NAS. See README.md.
# Project dir on the NAS: /volume1/docker/razorreaper/src/RR-Admin-Panel/deploy/nas (mirrored from
# the repo). Secrets/credentials never live in this tree: they sit under ${DATA_DIR}/env and
# ${DATA_DIR}/cloudflared so a source re-sync can never clobber or publish them.
name: razorreaper
services:
  # Locally-managed tunnel: ingress rules in ./cloudflared/config.yml (tracked, no secrets),
  # credentials JSON (created by `cloudflared tunnel create rr-nas`) in ${DATA_DIR}/cloudflared.
  cloudflared:
    image: cloudflare/cloudflared:latest
    # SMB-synced configs are owned by the NAS source-share group (GID 10).
    group_add:
      - "10"
    restart: unless-stopped
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      - ${DATA_DIR}/cloudflared:/etc/cloudflared/creds:ro
    # no depends_on: services come up in stages (media -> bot -> api); cloudflared answers 502
    # for a hostname until its container exists and keeps retrying.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${MEDIA_DIR}:/srv/media:ro
    # no ports: reachable only through the tunnel (and the docker network)

  bot:
    build:
      context: ${BOT_SRC}
    restart: unless-stopped
    env_file: ${DATA_DIR}/env/bot.env   # TOKEN, NOTIFIER_*, VERIFY_* (see .env.example)
    environment:
      - PORT=8080
    volumes:
      - ${DATA_DIR}/bot:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # rr-api (W3.5): Node 22 service running the Pages Functions + worker code on SQLite.
  # Tunnel hostname api.<domain> -> http://rr-api:8787 (no host port; reachable only via the tunnel).
  rr-api:
    image: razorreaper-rr-api:release-hardening-20260831
    build:
      context: ../..
      dockerfile: deploy/nas/rr-api/Dockerfile
    restart: unless-stopped
    env_file: ${DATA_DIR}/env/rr-api.env   # copy of rr-api/.env.example, filled in
    volumes:
      - ${DATA_DIR}/db:/data/db
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Admin SPA + same-origin API gateway. Cloudflare Access protects
  # admin.<domain>; Caddy forwards its JWT and browser Origin/Host to rr-api.
  admin:
    image: razorreaper-admin:release-hardening-20260831
    build:
      context: ../..
      dockerfile: deploy/nas/admin/Dockerfile
    restart: unless-stopped
    env_file: ${DATA_DIR}/env/admin.env   # ORIGIN_KEY only; see admin.env.example
    depends_on:
      rr-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  backup:
    image: alpine:3.20
    restart: unless-stopped
    volumes:
      - ${DATA_DIR}/db:/data/db:ro
      - ${BACKUP_DIR}:/backups
      - ./backup/backup.sh:/backup.sh:ro
    command: sh -c "apk add --no-cache sqlite >/dev/null && echo '15 3 * * * sh /backup.sh' > /etc/crontabs/root && crond -f -l 2"
