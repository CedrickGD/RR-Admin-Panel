name = "backend"
main = "index.js"
compatibility_date = "2026-03-03"

[[d1_databases]]
binding = "DB"
database_name = "rr_admin_panel"
database_id = "replace-with-d1-database-id"

# Nightly license cleanup — see the scheduled() handler in index.js.
[triggers]
crons = ["30 3 * * *"]

# Mirror everything below into the real (gitignored) backend-worker/wrangler.toml.
# Secrets stay out of this file: APP_SHARED_KEY / INGEST_TOKEN (legacy ingest key) and
# GITHUB_TOKEN are set with `npx wrangler secret put <NAME>`.
[vars]
# "true" keeps accepting the shared legacy ingest key (rows tagged ingest_auth_mode='legacy_key');
# flip to "false" once every client signs its requests (rr.install.v1).
LEGACY_INGEST_KEY_ENABLED = "true"
# Proxy mode (docs/superpowers/specs/2026-08-21-proxy-shells.md): with ORIGIN_BASE set AND the
# ORIGIN_KEY secret present (`npx wrangler secret put ORIGIN_KEY`, same value as rr-api), every
# /api/* and /v1/* request except health is forwarded to rr-api on the NAS; /media/*, /update/*
# and health stay local. Leave unset to keep serving from D1.
# ORIGIN_BASE = "https://origin.razorreaper.app"

# Per-IP rate limits (Workers rate-limit bindings). Missing bindings fail open.
[[unsafe.bindings]]
name = "RL_INGEST"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[[unsafe.bindings]]
name = "RL_REGISTER"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 5, period = 60 }
