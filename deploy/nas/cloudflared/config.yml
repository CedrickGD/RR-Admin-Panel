# Ingress for the locally-managed tunnel "rr-nas" (hostnames are public DNS anyway — no secrets here).
# Credentials JSON lives in ${DATA_DIR}/cloudflared on the NAS, mounted read-only at /etc/cloudflared/creds.
tunnel: 5d1207af-345f-4713-87c4-c5dcc58a0ade
credentials-file: /etc/cloudflared/creds/5d1207af-345f-4713-87c4-c5dcc58a0ade.json
ingress:
  - hostname: media.razorreaper.app
    service: http://caddy:8080
  - hostname: bot.razorreaper.app
    service: http://bot:8080
  - hostname: api.razorreaper.app
    service: http://rr-api:8787
  # Upstream of the worker/Pages proxy shells (W3.7): same container, but rr-api only accepts
  # requests on this hostname with the ORIGIN_KEY (401 otherwise). Keep it out of the WAF
  # rate-limit rule — the shells' subrequests all come from Cloudflare egress IPs.
  - hostname: origin.razorreaper.app
    service: http://rr-api:8787
  - service: http_status:404
