name: CI

on:
  pull_request:
  push:
    branches: [main, "feat/**"]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # rr-api (deploy/nas/rr-api) has its own lockfile; its native better-sqlite3 dependency is
      # what tests/rr-api/** run against, so install it with scripts enabled (prebuilt binary).
      - run: npm ci --no-audit --no-fund
        working-directory: deploy/nas/rr-api
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build
        working-directory: deploy/nas/rr-api
      - run: node --check backend-worker/index.js
      - name: Build NAS admin image
        run: docker build -f deploy/nas/admin/Dockerfile -t rr-admin-ci .
